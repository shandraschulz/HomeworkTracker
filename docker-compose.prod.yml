# Docker Compose for PRODUCTION
# Designed for Portainer deployment behind Traefik reverse proxy with Cloudflare tunnel
# Usage: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: homework-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-homework_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homework-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homework} -d ${POSTGRES_DB:-homework_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No external ports - only accessible within docker network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homework-backend
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-homework}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-homework_tracker}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://homework.yourdomain.com}
    networks:
      - homework-internal
    depends_on:
      db:
        condition: service_healthy
    # No external ports - only accessible via frontend nginx proxy

  # Nginx Frontend with Traefik labels
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homework-frontend
    restart: always
    networks:
      - homework-internal
      - traefik  # External network for Traefik (matches homelab)
    depends_on:
      - backend
    labels:
      # Enable Traefik for this service
      - "traefik.enable=true"
      
      # HTTP Router (Cloudflare tunnel handles SSL termination)
      - "traefik.http.routers.homework.rule=Host(`${DOMAIN:-homework.jkbell.net}`)"
      - "traefik.http.routers.homework.entrypoints=web"
      
      # Service definition
      - "traefik.http.services.homework.loadbalancer.server.port=80"
      
      # Specify which network Traefik should use
      - "traefik.docker.network=traefik"

networks:
  homework-internal:
    driver: bridge
  traefik:
    name: traefik
    external: true

volumes:
  postgres_data:
