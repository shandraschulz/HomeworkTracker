<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homework Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="tracker.css">
  <script>
    // API configuration - will be set by nginx or environment
    window.API_BASE_URL = '/api';
  </script>
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top border-bottom">
    <div class="container-fluid px-3">
      <span class="navbar-brand fw-bold">Homework Tracker</span>

      <div class="ms-3 me-auto class-tabs" id="classTabs"></div>

      <div class="d-flex gap-2 align-items-center">
        <div class="input-group input-group-sm add-class">
          <input id="classNameInput" class="form-control" placeholder="Add class (e.g., CSCI 222)" aria-label="Add class">
          <button id="addClassBtn" class="btn btn-ghost">Add</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-3 align-items-stretch">

      <div class="col-12">
        <div class="card soft-card shadow-sm">
          <div class="card-body d-flex flex-wrap gap-3 align-items-center justify-content-between">
            <div>
              <h4 class="mb-1" id="activeClassTitle">Select a class</h4>
              <div class="text-muted small" id="activeClassSubtitle">Add a class up top to begin.</div>
            </div>

            <div class="d-flex flex-wrap gap-2 align-items-center">
              <!-- View buttons removed per request -->

              <button class="btn btn-secondary-soft btn-sm" id="clearCompletedBtn" disabled>Clear completed</button>
              <button id="undoClearBtn" class="btn btn-outline-secondary btn-sm d-none">Undo</button>
              <button id="downloadBackupBtn" class="btn btn-secondary-soft btn-sm">Download backup</button>
              <input id="backupFileInput" type="file" accept=".json" class="d-none">
              <button id="uploadBackupBtn" class="btn btn-secondary-soft btn-sm">Upload backup</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="card soft-card shadow-sm">
          <div class="card-body">
            <div class="row g-2 align-items-center">
              <div class="col-12 col-lg-7">
                <input id="taskTitleInput" class="form-control" placeholder="Add a task (e.g., Bootstrap tutorial #3)" disabled>
              </div>
              <div class="col-8 col-sm-6 col-lg-3">
                <input id="taskDueInput" type="date" class="form-control" disabled>
              </div>
              <div class="col-4 col-sm-3 col-lg-2 d-grid">
                <button id="addTaskBtn" class="btn btn-sage" disabled>Add</button>
              </div>
            </div>
            <div class="small text-muted mt-2">
              Tip: Type task → pick due date → press <span class="kbd">Enter</span>.
            </div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="card soft-card shadow-sm">
          <div class="card-body">

            <div id="weekView" class="d-none">
              <div class="accordion" id="weeksAccordion"></div>
            </div>

            <div id="listView" class="d-none">
              <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
                <span class="pill">Sorted by due date</span>
                <span class="pill" id="listCountPill">0 tasks</span>
              </div>
              <ul class="list-group list-group-flush" id="listTaskList"></ul>
            </div>

            <div id="focusView" class="d-none">
              <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
                <span class="pill" id="focusTitlePill">Today</span>
                <span class="pill" id="focusCountPill">0 tasks</span>
              </div>
              <ul class="list-group list-group-flush" id="focusTaskList"></ul>
            </div>

            <div id="dashboardView" class="d-none">
              <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
                <span class="pill">Dashboard</span>
                <span class="pill" id="dashboardCountPill">0 tasks</span>
              </div>
              <ul class="list-group list-group-flush" id="dashboardTaskList"></ul>
            </div>

            <div id="emptyState" class="text-center py-5 text-muted">
              <div class="empty-emoji mb-2">🌿</div>
              <div class="fw-semibold">Choose a class to see your weeks.</div>
              <div class="small">Everything saves automatically.</div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="tracker.js"></script>
</body>
</html>
